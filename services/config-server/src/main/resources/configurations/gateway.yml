server:
  port: 8222

spring:
  application:
    name: gateway
  cloud:
    config:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # Staff Service Routes
        - id: staff-service
          uri: lb://staff-service
          predicates:
            - Path=/api/v1/staff/**,/api/v1/evaluations/**,/api/v1/schedules/**,/api/v1/test/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # Flight Service Routes
        - id: flight-service
          uri: lb://flight-service
          predicates:
            - Path=/api/v1/flights/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # Chat Service Routes - API
        - id: chat-service-api
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # Chat WebSocket Routes - FIXED with DedupeResponseHeader filter
        - id: chat-websocket
          uri: lb://chat-service
          predicates:
            - Path=/ws/**
          filters:
            # CRITICAL FIX: Remove duplicate CORS headers
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          metadata:
            connect-timeout: 30000
            response-timeout: 30000

        # Reporting Service Routes
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/api/v1/reports/**
          # No filters; forward headers by default
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        # Actuator Health Proxies per service (for Admin UI)
        - id: auth-service-actuator
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth-service/actuator/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - StripPrefix=3

        - id: staff-service-actuator
          uri: lb://staff-service
          predicates:
            - Path=/api/v1/staff-service/actuator/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - StripPrefix=3

        - id: flight-service-actuator
          uri: lb://flight-service
          predicates:
            - Path=/api/v1/flight-service/actuator/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - StripPrefix=3

        - id: reporting-service-actuator
          uri: lb://reporting-service
          predicates:
            - Path=/api/v1/reporting-service/actuator/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - StripPrefix=3

        - id: chat-service-actuator
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat-service/actuator/**
          filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - StripPrefix=3


      # Global CORS - Now includes WebSocket paths
      globalcors:
        cors-configurations:
          '[/**]':  # Apply to ALL paths including WebSocket
            allowedOriginPatterns:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Access-Control-Allow-Origin"
              - "Access-Control-Allow-Credentials"
            allowCredentials: true
            maxAge: 3600
        add-to-simple-url-handler-mapping: true

eureka:
  client:
    register-with-eureka: false
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.cors: DEBUG
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, gateway
      base-path: /api/v1/actuator
      cors:
        allowed-origins: "http://localhost:3000"
        allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
        allowed-headers: "*"
        allow-credentials: true
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      all: true